[project]
name = "sphersgeo"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Rust",
]
dependencies = ["numpy"]
dynamic = ["version"]

[project.urls]
source = "https://github.com/spacetelescope/sphersgeo"

[dependency-groups]
test = ["pytest", "gwcs"]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.cibuildwheel]
build = "cp39-*"
test-requires = ["abi3audit"]
test-command = "python -c 'from sphersgeo import SphericalPoint, MultiSphericalPoint, ArcString, MultiArcString, SphericalPolygon, MultiSphericalPolygon' && abi3audit --strict --report dist/*.whl"

[tool.maturin]
features = ["pyo3/extension-module", "py"]
python-source = "src/python/"
